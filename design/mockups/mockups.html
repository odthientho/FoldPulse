.hero.small .num { font-size: 46px; }

.tn.big { font-size: 38px; } .tn.pos, .num.pos { color: var(--pos); }
.tc { font-size: 11.5px; color: var(--text2); line-height: 1.4; } .tc.center { text-align: center; margin-top: 10px; }

.covbar i { display: block; } .covbar .a { background: var(--accent); } .covbar .s { background: var(--shortcut); } .covbar .m { background: var(--manual); }

.badge.shortcut { color: var(--shortcut); background: color-mix(in srgb, var(--shortcut) 14%, transparent); }
.badge.manual { color: var(--manual); background: color-mix(in srgb, var(--manual) 14%, transparent); }
.badge.gap { color: var(--text2); border: 1px dashed var(--text2); }
/* lists */
.list { background: var(--surface); border-radius: 16px; overflow: hidden; margin-bottom: 8px; }
.row { display: flex; align-items: center; gap: 10px; padding: 10px 13px; border-bottom: 1px solid var(--line); font-size: 13.5px; position: relative; }
.row:last-child { border-bottom: none; } .rt { width: 42px; color: var(--text2); font-variant-numeric: tabular-nums; font-size: 12.5px; }
.ry { flex: 1; font-weight: 550; } .rv { color: var(--text2); font-size: 12.5px; text-align: right; } .rv.pos { color: var(--pos); font-weight: 600; }
.row.set svg:last-child { width: 14px; height: 14px; color: var(--text2); }
.destt { color: var(--dest); } .gaprow { opacity: .75; } .noteic { color: var(--text2); margin-left: 6px; font-size: 11px; }
.row.swiped { transform: translateX(-74px); } .row.swiped .del { position: absolute; right: -74px; top: 0; bottom: 0; width: 74px; background: var(--dest); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; }
.chips { display: flex; gap: 6px; margin-bottom: 8px; flex-wrap: wrap; } .chip { font-size: 11.5px; padding: 5px 10px; border-radius: 14px; background: var(--chip); color: var(--text2); font-weight: 600; } .chip.on { background: var(--accent); color: #fff; }
.search { font-size: 12.5px; color: var(--accentText); font-weight: 600; margin: 2px 2px 0; }
.foot { font-size: 11px; color: var(--text2); margin: 8px 2px; }

.btn { display: flex; align-items: center; justify-content: center; gap: 8px; height: 46px; border-radius: 23px; font-weight: 700; font-size: 15px; margin: 8px 0; }
.btn svg { width: 18px; height: 18px; } .btn.big { height: 56px; border-radius: 28px; font-size: 17px; }
.btn.primary { background: var(--accent); color: #fff; } .btn.secondary { background: color-mix(in srgb, var(--accent) 14%, transparent); color: var(--accentText); }

.rec { margin-top: 8px; } .link { color: var(--accentText); font-weight: 600; font-size: 13px; } .link.b { font-weight: 800; }

.card.setup { display: flex; gap: 10px; align-items: flex-start; } .card.setup > svg { width: 22px; height: 22px; flex-shrink: 0; margin-top: 2px; }
.warnb > svg { color: var(--warn); } .okb > svg { color: var(--pos); } .infob > svg { color: var(--accentText); }
.st { font-weight: 700; font-size: 13.5px; margin-bottom: 3px; } .ss { font-size: 12px; color: var(--text2); line-height: 1.4; margin-bottom: 4px; }
.empty .em-t { font-weight: 700; font-size: 15px; margin-bottom: 4px; } .empty .em-s { font-size: 12.5px; color: var(--text2); line-height: 1.45; }

.dim { position: absolute; inset: 0; background: rgba(0,0,0,.38); z-index: 4; }
.sheet { position: absolute; left: 0; right: 0; bottom: 0; background: var(--bg); border-radius: 30px 30px 0 0; padding: 8px 18px 26px; z-index: 5; }
.grab { width: 38px; height: 5px; border-radius: 3px; background: var(--line); margin: 0 auto 10px; }

.seg { display: flex; background: var(--chip); border-radius: 10px; padding: 2px; margin: 0 0 10px; } .seg span { flex: 1; text-align: center; font-size: 12.5px; font-weight: 650; padding: 5px; border-radius: 8px; color: var(--text2); } .seg span.on { background: var(--surface); color: var(--text); }

.ins-h { margin-bottom: 8px; }

.msn { font-size: 64px; font-weight: 800; letter-spacing: -2px; background: linear-gradient(90deg, var(--accent), #5CC8FF); -webkit-background-clip: text; color: transparent; } .mst { font-size: 15px; font-weight: 600; }
.intro { font-size: 13px; color: var(--text2); line-height: 1.45; margin-bottom: 10px; }

.ic { border-radius: 22.5%; overflow: hidden; box-shadow: 0 4px 14px rgba(0,0,0,.18); } .ic svg { width: 100%; height: 100%; display: block; }

.xbtn { width: 30px; height: 30px; border-radius: 15px; background: var(--chip); display: inline-flex; align-items: center; justify-content: center; font-size: 13px; color: var(--text2); }
.tn small { color: var(--text2); }
