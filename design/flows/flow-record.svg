FF" stroke="#8DB6FF" stroke-width="1.6"/><text x="325.0" y="93.0" text-anchor="middle" font-size="13" font-weight="700" fill="#0B1B33">Automatic event</text><text x="325.0" y="109.0" text-anchor="middle" font-size="11" font-weight="400" fill="#0B1B33">hero rolls, pulse beats</text><rect x="30" y="180" width="170" height="54" rx="22" fill="#2F7BFF" stroke="#2F7BFF" stroke-width="1.6"/><text x="115.0" y="203.0" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">User folds phone</text><text x="115.0" y="219.0" text-anchor="middle" font-size="11" font-weight="400" fill="#FFFFFF">(app closed)</text><rect x="240" y="180" width="170" height="54" rx="10" fill="#EAF1FF" stroke="#8DB6FF" stroke-width="1.6"/><text x="325.0" y="203.0" text-anchor="middle" font-size="13" font-weight="700" fill="#0B1B33">Shortcut event</text><text x="325.0" y="219.0" text-anchor="middle" font-size="11" font-weight="400" fill="#0B1B33">(if set up)</text><rect x="450" y="125" width="170" height="54" rx="10" fill="#EAF1FF" stroke="#8DB6FF" stroke-width="1.6"/><text x="535.0" y="148.0" text-anchor="middle" font-size="13" font-weight="700" fill="#0B1B33">De-duplicate ±10 s</text><text x="535.0" y="164.0" text-anchor="middle" font-size="11" font-weight="400" fill="#0B1B33">reconcile gaps</text><rect x="30" y="300" width="170" height="54" rx="22" fill="#2F7BFF" stroke="#2F7BFF" stroke-width="1.6"/><text x="115.0" y="323.0" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">Record sheet</text><text x="115.0" y="339.0" text-anchor="middle" font-size="11" font-weight="400" fill="#FFFFFF">Record Fold</text><rect x="240" y="300" width="170" height="54" rx="10" fill="#FFFFFF" stroke="#2F7BFF" stroke-width="1.6"/><text x="325.0" y="331.0" text-anchor="middle" font-size="13" font-weight="700" fill="#0B1B33">Toast with Undo (5 s)</text><rect x="660" y="125" width="140" height="54" rx="10" fill="#FFFFFF" stroke="#2F7BFF" stroke-width="1.6"/><text x="730.0" y="156.0" text-anchor="middle" font-size="13" font-weight="700" fill="#0B1B33">History</text><rect x="840" y="70" width="120" height="54" rx="22" fill="#2F7BFF" stroke="#2F7BFF" stroke-width="1.6"/><text x="900.0" y="93.0" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">Edit</text><text x="900.0" y="109.0" text-anchor="middle" font-size="11" font-weight="400" fill="#FFFFFF">→ &#x27;edited&#x27;</text><rect x="840" y="180" width="120" height="54" rx="10" fill="#FDECEA" stroke="#C2362B" stroke-width="1.6"/><text x="900.0" y="203.0" text-anchor="middle" font-size="13" font-weight="700" fill="#0B1B33">Delete</text><text x="900.0" y="219.0" text-anchor="middle" font-size="11" font-weight="400" fill="#0B1B33">(confirm)</text><rect x="660" y="300" width="300" height="54" rx="22" fill="#0B1B33" stroke="#0B1B33" stroke-width="1.6"/><text x="810.0" y="323.0" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">Totals, coverage, widgets update</text><text x="810.0" y="339.0" text-anchor="middle" font-size="11" font-weight="400" fill="#FFFFFF">milestone checked (fires once)</text><text x="24" y="404" font-size="11" fill="#55606E">Manual events go through the same de-duplication, so a manual tap right after an automatic fold isn&#x27;t double counted.</text><rect x="460" y="20" width="14" height="14" rx="3" fill="#FFFFFF" stroke="#2F7BFF"/><text x="480" y="31" font-size="11" fill="#55606E">Screen</text><rect x="564" y="20" width="14" height="14" rx="3" fill="#2F7BFF" stroke="#2F7BFF"/><text x="584" y="31" font-size="11" fill="#55606E">User action</text><rect x="668" y="20" width="14" height="14" rx="3" fill="#EAF1FF" stroke="#8DB6FF"/><text x="688" y="31" font-size="11" fill="#55606E">System / iOS</text><rect x="772" y="20" width="14" height="14" rx="3" fill="#FFF6E5" stroke="#A15C00"/><text x="792" y="31" font-size="11" fill="#55606E">Decision</text><rect x="876" y="20" width="14" height="14" rx="3" fill="#FDECEA" stroke="#C2362B"/><text x="896" y="31" font-size="11" fill="#55606E">Problem path</text></svg>