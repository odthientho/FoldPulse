ne</text><rect x="20" y="372" width="920" height="62" rx="10" fill="#2F7BFF" stroke="#2F7BFF" stroke-width="1.4"/><text x="480.0" y="398.0" text-anchor="middle" font-size="12.5" font-weight="700" fill="#FFFFFF">FoldPulseCore  (Swift package · pure Swift · tested on Linux + macOS)</text><text x="480.0" y="414.0" text-anchor="middle" font-size="10.5" fill="#FFFFFF">FoldEvent · EventType · DetectionSource · LocalDay · Statistics · Milestones · WidgetSnapshot</text><path d="M320,352 L320,370" stroke="#55606E" stroke-width="1.5" fill="none" marker-end="url(#a)"/><path d="M790,286 L790,370" stroke="#55606E" stroke-width="1.5" fill="none" marker-end="url(#a)"/><path d="M790,212 L790,230" stroke="#55606E" stroke-width="1.5" fill="none" marker-end="url(#a)"/><path d="M600,229 L638,255" stroke="#55606E" stroke-width="1.5" fill="none" marker-end="url(#a)"/><text x="624.0" y="238.0" font-size="10" fill="#55606E" stroke="#F7F8FA" stroke-width="4" paint-order="stroke">writes JSON</text><text x="24" y="456" font-size="11" fill="#55606E">Arrows point to dependencies. The widget never links app code or opens the database.</text></svg>