<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" font-family="Inter, sans-serif">
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#14284A"/><stop offset="1" stop-color="#070F1F"/></linearGradient>
    <linearGradient id="g2" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2F7BFF"/><stop offset="1" stop-color="#5CC8FF"/></linearGradient>
  </defs>
  <rect width="900" height="470" fill="#F7F8FA" rx="14"/>
  <text x="30" y="38" font-size="18" font-weight="700" fill="#0B1B33">Initial visual direction — temporary concept (finalised in Phase 2)</text>
  <text x="30" y="72" font-size="13" font-weight="700" fill="#5B6472">COLOUR</text>
  <g font-size="11">
    <rect x="30" y="84" width="120" height="70" rx="10" fill="#0B1B33"/><text x="30" y="172" fill="#0B1B33" font-weight="600">Deep Navy</text><text x="30" y="187" fill="#5B6472">#0B1B33 · surfaces (dark)</text>
    <rect x="170" y="84" width="120" height="70" rx="10" fill="#2F7BFF"/><text x="170" y="172" fill="#0B1B33" font-weight="600">Pulse Blue</text><text x="170" y="187" fill="#5B6472">#2F7BFF · primary accent</text>
    <rect x="310" y="84" width="120" height="70" rx="10" fill="#5CC8FF"/><text x="310" y="172" fill="#0B1B33" font-weight="600">Signal Cyan</text><text x="310" y="187" fill="#5B6472">#5CC8FF · gradient end</text>
    <rect x="450" y="84" width="120" height="70" rx="10" fill="#F7F8FA" stroke="#C9D3E3"/><text x="450" y="172" fill="#0B1B33" font-weight="600">Soft White</text><text x="450" y="187" fill="#5B6472">#F7F8FA · surfaces (light)</text>
    <rect x="590" y="84" width="120" height="70" rx="10" fill="#5B6472"/><text x="590" y="172" fill="#0B1B33" font-weight="600">Graphite Gray</text><text x="590" y="187" fill="#5B6472">#5B6472 · secondary text</text>
    <rect x="730" y="84" width="140" height="70" rx="10" fill="url(#g2)"/><text x="730" y="172" fill="#0B1B33" font-weight="600">Pulse gradient</text><text x="730" y="187" fill="#5B6472">accents only, sparingly</text>
  </g>
  <text x="30" y="226" font-size="13" font-weight="700" fill="#5B6472">TYPE (SF Pro in app · Inter in documents)</text>
  <text x="30" y="276" font-size="44" font-weight="700" fill="#0B1B33" letter-spacing="-1">12,458</text>
  <text x="30" y="298" font-size="11" fill="#5B6472">Hero numeral · SF Pro Rounded Bold, monospaced digits · illustrative value</text>
  <text x="30" y="330" font-size="20" font-weight="600" fill="#0B1B33">Today · 38 folds</text>
  <text x="30" y="352" font-size="14" fill="#5B6472">Body · secondary label · Dynamic Type</text>
  <text x="470" y="226" font-size="13" font-weight="700" fill="#5B6472">APP ICON CONCEPTS</text>
  <!-- A: folded device + pulse -->
  <g transform="translate(470,240)">
    <rect width="110" height="110" rx="25" fill="url(#g1)"/>
    <path d="M30 28 L55 38 L55 86 L30 76 Z" fill="#2F7BFF" opacity="0.9"/>
    <path d="M55 38 L80 28 L80 76 L55 86 Z" fill="#5CC8FF" opacity="0.75"/>
    <path d="M18 62 L38 62 L45 50 L53 74 L60 56 L66 62 L92 62" stroke="#fff" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="55" y="132" font-size="11" text-anchor="middle" fill="#0B1B33" font-weight="600">A · Fold + pulse</text>
  </g>
  <!-- B: hinge arc -->
  <g transform="translate(610,240)">
    <rect width="110" height="110" rx="25" fill="#F7F8FA" stroke="#C9D3E3"/>
    <path d="M28 82 A30 30 0 0 1 82 82" stroke="url(#g2)" stroke-width="9" fill="none" stroke-linecap="round"/>
    <rect x="51" y="30" width="8" height="52" rx="4" fill="#0B1B33"/>
    <circle cx="55" cy="82" r="7" fill="#0B1B33"/>
    <text x="55" y="132" font-size="11" text-anchor="middle" fill="#0B1B33" font-weight="600">B · Hinge arc</text>
  </g>
  <!-- C: P monogram -->
  <g transform="translate(750,240)">
    <rect width="110" height="110" rx="25" fill="#2F7BFF"/>
    <path d="M34 30 L34 82 M34 30 L62 30 A16 16 0 0 1 62 62 L34 62" stroke="#fff" stroke-width="9" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M58 76 L66 76 L71 68 L77 84 L82 76" stroke="#0B1B33" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="55" y="132" font-size="11" text-anchor="middle" fill="#0B1B33" font-weight="600">C · Pulse monogram</text>
  </g>
  <g transform="translate(470,400)" font-size="11" fill="#5B6472">
    <text>Small-size test (29 pt):</text>
    <g transform="translate(140,-16)"><rect width="22" height="22" rx="5" fill="url(#g1)"/><path d="M5 12 L9 12 L11 9 L13 15 L15 11 L17 12" stroke="#fff" stroke-width="1.4" fill="none"/></g>
    <g transform="translate(172,-16)"><rect width="22" height="22" rx="5" fill="#F7F8FA" stroke="#C9D3E3"/><path d="M5 16 A6 6 0 0 1 17 16" stroke="#2F7BFF" stroke-width="2" fill="none"/></g>
    <g transform="translate(204,-16)"><rect width="22" height="22" rx="5" fill="#2F7BFF"/><path d="M7 6 L7 16 M7 6 L12 6 A3 3 0 0 1 12 12 L7 12" stroke="#fff" stroke-width="1.8" fill="none"/></g>
    <text x="240" y="0">A is recommended: it reads best when small</text>
  </g>
  <text x="30" y="440" font-size="11" fill="#5B6472">Principles: native SF Symbols and system materials · one accent colour · no decorative chrome · charts in Pulse Blue on neutral grids · equal quality in light and dark mode.</text>
</svg>
