<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" font-family="Inter, sans-serif">
  <defs><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0B1B33"/></marker></defs>
  <rect width="900" height="330" fill="#F7F8FA" rx="14"/>
  <text x="30" y="38" font-size="18" font-weight="700" fill="#0B1B33">Hinge status → events (counting rules)</text>
  <g font-size="14" font-weight="700" text-anchor="middle">
    <rect x="60" y="120" width="170" height="70" rx="35" fill="#0B1B33"/><text x="145" y="160" fill="#fff">closed</text>
    <rect x="400" y="70" width="190" height="70" rx="35" fill="#2F7BFF"/><text x="495" y="110" fill="#fff">partiallyOpen</text>
    <rect x="400" y="190" width="190" height="70" rx="35" fill="#2F7BFF"/><text x="495" y="230" fill="#fff">fullyOpen</text>
    <rect x="700" y="130" width="160" height="50" rx="25" fill="#E3E6EB"/><text x="780" y="160" fill="#5B6472" font-size="13">unknown / nil</text>
  </g>
  <g stroke="#0B1B33" stroke-width="2" fill="none" marker-end="url(#b)">
    <path d="M230,140 C300,100 340,100 398,100"/>
    <path d="M230,170 C300,215 340,225 398,225"/>
    <path d="M400,118 C330,140 300,148 233,150"/>
    <path d="M400,208 C330,185 300,178 233,172"/>
  </g>
  <path d="M495,142 L495,188" stroke="#8DB6FF" stroke-width="2" marker-end="url(#b)"/>
  <path d="M505,188 L505,142" stroke="#8DB6FF" stroke-width="2" marker-end="url(#b)"/>
  <g font-size="12" font-weight="700" stroke="#F7F8FA" stroke-width="5" paint-order="stroke">
    <text x="290" y="92" fill="#2F7BFF">UNFOLD</text>
    <text x="290" y="244" fill="#2F7BFF">UNFOLD</text>
    <text x="300" y="138" fill="#0B1B33">FOLD</text>
    <text x="300" y="196" fill="#0B1B33">FOLD</text>
    <text x="515" y="170" fill="#5B6472">not counted</text>
  </g>
  <text x="700" y="205" font-size="11" fill="#5B6472">never counted;</text><text x="700" y="220" font-size="11" fill="#5B6472">doesn't move the baseline</text>
  <g font-size="11.5" fill="#0B1B33">
    <text x="30" y="290">• Committed after ≥ 250 ms stable; timestamp = first entered · flushed on scene-phase change · first reading after activation only sets the baseline</text>
    <text x="30" y="310">• Duplicates: same type, nothing opposite in between, |Δt| ≤ 10 s, either order → keep hinge &gt; shortcut &gt; manual &gt; inferred</text>
  </g>
</svg>
