<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" font-family="Inter, sans-serif">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5B6472"/></marker></defs>
  <rect width="900" height="470" fill="#F7F8FA" rx="14"/>
  <text x="30" y="38" font-size="18" font-weight="700" fill="#0B1B33">Proposed architecture (local-only)</text>
  <!-- device boundary -->
  <rect x="20" y="55" width="860" height="400" rx="14" fill="none" stroke="#0B1B33" stroke-width="1.5" stroke-dasharray="4 4"/>
  <text x="34" y="76" font-size="11" fill="#5B6472">iPhone Duo — nothing leaves this boundary (no network code)</text>
  <!-- app process -->
  <rect x="40" y="90" width="520" height="250" rx="12" fill="#fff" stroke="#C9D3E3"/>
  <text x="56" y="112" font-size="13" font-weight="700" fill="#0B1B33">FoldPulse app process</text>
  <g font-size="12" text-anchor="middle">
    <rect x="60" y="128" width="150" height="52" rx="9" fill="#2F7BFF"/><text x="135" y="150" fill="#fff" font-weight="600">Hinge Observer</text><text x="135" y="167" fill="#E3ECFF" font-size="10">onHingeChange (fg)</text>
    <rect x="60" y="196" width="150" height="52" rx="9" fill="#8DB6FF"/><text x="135" y="218" fill="#0B1B33" font-weight="600">App Intents</text><text x="135" y="235" fill="#0B1B33" font-size="10">Record Fold/Unfold (bg)</text>
    <rect x="60" y="264" width="150" height="52" rx="9" fill="#C9D3E3"/><text x="135" y="286" fill="#0B1B33" font-weight="600">SwiftUI Screens</text><text x="135" y="303" fill="#0B1B33" font-size="10">Manual record · edit</text>
    <rect x="250" y="160" width="140" height="120" rx="9" fill="#0B1B33"/><text x="320" y="196" fill="#fff" font-weight="600">Event Pipeline</text>
    <text x="320" y="215" fill="#AFC6EE" font-size="10">debounce · baseline</text><text x="320" y="230" fill="#AFC6EE" font-size="10">dedupe · reconcile</text><text x="320" y="245" fill="#AFC6EE" font-size="10">single ModelActor writer</text>
    <rect x="420" y="128" width="125" height="52" rx="9" fill="#fff" stroke="#0B1B33"/><text x="482" y="150" fill="#0B1B33" font-weight="600">Analytics</text><text x="482" y="167" fill="#5B6472" font-size="10">aggregates (cached)</text>
    <rect x="420" y="264" width="125" height="52" rx="9" fill="#fff" stroke="#0B1B33"/><text x="482" y="286" fill="#0B1B33" font-weight="600">Export / Import</text><text x="482" y="303" fill="#5B6472" font-size="10">JSON · CSV · share sheet</text>
  </g>
  <g stroke="#5B6472" stroke-width="1.5" fill="none" marker-end="url(#a)">
    <path d="M210,154 L248,190"/><path d="M210,222 L248,222"/><path d="M210,290 L248,255"/>
    <path d="M390,190 L418,160"/><path d="M390,250 L418,285"/>
  </g>
  <!-- App group -->
  <rect x="40" y="360" width="520" height="80" rx="12" fill="#EAF1FF" stroke="#8DB6FF"/>
  <text x="56" y="382" font-size="13" font-weight="700" fill="#0B1B33">App Group container (file protection: until first unlock)</text>
  <g font-size="11" text-anchor="middle">
    <rect x="60" y="392" width="150" height="38" rx="7" fill="#fff" stroke="#8DB6FF"/><text x="135" y="415" fill="#0B1B33">SwiftData store (events)</text>
    <rect x="230" y="392" width="150" height="38" rx="7" fill="#fff" stroke="#8DB6FF"/><text x="305" y="415" fill="#0B1B33">WidgetSnapshot.json</text>
    <rect x="400" y="392" width="145" height="38" rx="7" fill="#fff" stroke="#8DB6FF"/><text x="472" y="415" fill="#0B1B33">pending-events queue</text>
  </g>
  <path d="M320,280 L320,388" stroke="#5B6472" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
  <!-- widget extension -->
  <rect x="600" y="90" width="260" height="250" rx="12" fill="#fff" stroke="#C9D3E3"/>
  <text x="616" y="112" font-size="13" font-weight="700" fill="#0B1B33">Widget extension (WidgetKit)</text>
  <g font-size="12" text-anchor="middle">
    <rect x="620" y="128" width="220" height="44" rx="9" fill="#C9D3E3"/><text x="730" y="155" fill="#0B1B33">Home: small (+ M/L in v1.1)</text>
    <rect x="620" y="182" width="220" height="44" rx="9" fill="#C9D3E3"/><text x="730" y="209" fill="#0B1B33">Lock Screen: circular · rect</text>
    <rect x="620" y="236" width="220" height="44" rx="9" fill="#C9D3E3"/><text x="730" y="263" fill="#0B1B33">StandBy (via small)</text>
    <text x="730" y="305" fill="#5B6472" font-size="10">reads snapshot only · shows "as of"</text>
    <text x="730" y="322" fill="#5B6472" font-size="10">"+ Fold" button → queue file</text>
  </g>
  <g stroke="#5B6472" stroke-width="1.5" fill="none" marker-end="url(#a)">
    <path d="M380,405 C600,405 640,360 700,342"/>
    <path d="M760,342 C760,400 600,420 547,412"/>
  </g>
  <!-- Shortcuts -->
  <rect x="600" y="360" width="260" height="80" rx="12" fill="#fff" stroke="#C9D3E3"/>
  <text x="730" y="388" font-size="13" font-weight="700" fill="#0B1B33" text-anchor="middle">Shortcuts (system)</text>
  <text x="730" y="408" font-size="11" fill="#5B6472" text-anchor="middle">"Opened or Closed" automation</text>
  <text x="730" y="424" font-size="11" fill="#5B6472" text-anchor="middle">→ runs App Intent in background</text>
  <path d="M600,400 C400,330 260,250 212,236" stroke="#2F7BFF" stroke-width="1.5" fill="none" stroke-dasharray="5 3" marker-end="url(#a)"/>
</svg>
