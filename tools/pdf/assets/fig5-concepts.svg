  <g transform="translate(300,410)" font-size="11.5" fill="#0B1B33">
    <text y="0" font-weight="700">UI/UX Director notes (Agent 4)</text>
    <text y="20">• The hero number always says "since install". Each tile shows its source or freshness.</text>
    <text y="38">• The coverage tile is the trust signal and gets top-level placement.</text>
    <text y="56">• Outer display: one column, bars on the side (system vertical bars).</text>
    <text y="74">• Inner display: split layout via system containers; nothing in the fold region.</text>
    <text y="92">• Widgets show an "as of" time; Lock Screen counts are privacy-sensitive.</text>
