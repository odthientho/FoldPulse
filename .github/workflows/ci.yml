name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  # Queue main-branch runs (each batch gets its own result); cancel superseded PR runs only.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  core-linux:
    name: Core tests (Linux)
    runs-on: ubuntu-latest
    container: swift:6.1-noble
    steps:
      - uses: actions/checkout@v4
      - name: Test FoldPulseCore
        run: swift test --package-path Packages/FoldPulseCore

  ios:
    name: iOS build & tests (macOS)
    runs-on: macos-latest
    permissions:
      contents: write   # only to publish screenshots to the ci/screenshots branch
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Select the newest Xcode
        run: |
          ls -d /Applications/Xcode*.app || true
          XCODE="$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)"
          [ -n "$XCODE" ] && sudo xcode-select -s "$XCODE"
          xcodebuild -version
          echo "SDK_VERSION=$(xcrun --sdk iphonesimulator --show-sdk-version)" >> "$GITHUB_ENV"
      - name: Core tests (macOS)
        run: swift test --package-path Packages/FoldPulseCore
      - name: Privacy guard — no networking code in shipping targets (PRIVACY_REVIEW P-1)
        run: |
          if grep -rnE --include="*.swift" "URLSession|URLRequest|NSURLConnection|CFNetwork|SCNetwork|import Network|NWConnection|WKWebView|import WebKit|import CloudKit|CKContainer|AsyncImage|SFSafariViewController|ASWebAuthenticationSession|https?://" \
               FoldPulse Shared FoldPulseWidgets Packages/FoldPulseCore/Sources; then
            echo "::error::Networking symbols found in shipping code"; exit 1
          fi
          echo "No networking symbols found."
      - name: Generate Xcode project
        run: |
          brew install xcodegen
          # The app targets iOS 27.1 (iPhone Duo). When the runner's SDK is older, generate the
          # project with the runner's SDK as deployment target — a compile/test check only.
          if [ "$(printf '%s\n27.1\n' "$SDK_VERSION" | sort -V | head -1)" != "27.1" ]; then
            echo "::warning::Runner SDK $SDK_VERSION < 27.1 — deployment target lowered to $SDK_VERSION for CI only."
            echo "### ⚠️ Compile check on iOS $SDK_VERSION SDK (app targets 27.1)" >> "$GITHUB_STEP_SUMMARY"
            sed -i '' "s/iOS: \"27.1\"/iOS: \"$SDK_VERSION\"/" project.yml
            # The hinge API exists only in the iOS 27.1 SDK: compile without it here.
            sed -i '' 's/ HINGE_API$//' project.yml
            echo "- Hinge API code (HINGE_API) excluded: needs the iOS 27.1 SDK" >> "$GITHUB_STEP_SUMMARY"
            grep -n 'iOS:' project.yml
          fi
          xcodegen generate
      - name: Pick a simulator
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json,sys
          d=json.load(sys.stdin)["devices"]
          ios=[(k,v) for k,v in d.items() if "iOS" in k]
          ios.sort(key=lambda kv: [int(x) for x in kv[0].split("iOS-")[-1].split("-")])
          for k,v in reversed(ios):
              for dev in v:
                  if dev["name"].startswith("iPhone"):
                      print(dev["udid"]); sys.exit()
          ')
          [ -n "$UDID" ] || { echo "::error::No iPhone simulator available"; exit 1; }
          echo "SIM_UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl list devices available | grep -E "Duo|iPhone" | head -20
      - name: Build and test
        run: |
          set +e
          xcodebuild test \
            -project FoldPulse.xcodeproj -scheme FoldPulse \
            -destination "id=$SIM_UDID" \
            -resultBundlePath TestResults.xcresult \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO > xcodebuild.log 2>&1
          STATUS=$?
          grep -E "error:|warning: |Test Case .*(passed|failed)|Executed|\*\* " xcodebuild.log | tail -400
          if [ $STATUS -ne 0 ]; then echo "----- last 80 lines -----"; tail -80 xcodebuild.log; fi
          grep -E "Executed [0-9]+ tests" xcodebuild.log | tail -2 >> "$GITHUB_STEP_SUMMARY" || true
          grep -E "PERF |measured \[" xcodebuild.log | tee -a "$GITHUB_STEP_SUMMARY" || true
          # Compact results, published with the screenshots so they can be read with git.
          {
            echo "commit ${GITHUB_SHA::7} run ${GITHUB_RUN_NUMBER} xcodebuild_status=$STATUS"
            grep -E "Executed [0-9]+ tests" xcodebuild.log | tail -3
            grep -E "Test Case .* failed|: error: " xcodebuild.log | sort -u | head -100
            grep -E "PERF |measured \[" xcodebuild.log
          } > results.txt || true
          exit $STATUS
      - name: Release build for device (arm64, unsigned) — the shipping configuration
        if: always()
        run: |
          set -o pipefail
          xcodebuild build -project FoldPulse.xcodeproj -scheme FoldPulse -configuration Release \
            -destination "generic/platform=iOS" -derivedDataPath build-release CODE_SIGNING_ALLOWED=NO > release.log 2>&1 \
            || { grep -E "error:" release.log | head -40; tail -40 release.log; echo "Release build FAILED" >> results.txt; exit 1; }
          echo "Release device build: OK" | tee -a "$GITHUB_STEP_SUMMARY" results.txt
      - name: Privacy audit — no networking APIs linked in the built binaries (TEST_PLAN PT-02)
        if: always()
        run: |
          set -eo pipefail
          FAIL=0
          # Frameworks FoldPulse may link. Anything else fails the audit (allowlist, Phase 5 privacy review).
          ALLOWED="Foundation|SwiftUI|SwiftUICore|SwiftData|UIKit|CoreFoundation|Combine|WidgetKit|AppIntents|Charts|UserNotifications|CoreData|Observation|CoreGraphics|QuartzCore|CoreText|DeveloperToolsSupport|Symbols|CoreTransferable|UniformTypeIdentifiers|Accessibility|OSLog|os|CoreServices|ExtensionFoundation"
          audit() { # $1 = .app folder, $2 = label
            local APP="$1" list=""
            for f in "$APP/FoldPulse" "$APP/PlugIns/FoldPulseWidgets.appex/FoldPulseWidgets"; do
              [ -f "$f" ] || { echo "::error::$2: missing $f"; FAIL=1; }
            done
            for m in "$APP/PrivacyInfo.xcprivacy" "$APP/PlugIns/FoldPulseWidgets.appex/PrivacyInfo.xcprivacy"; do
              [ -f "$m" ] || { echo "::error::$2: privacy manifest missing: $m"; FAIL=1; }
            done
            # Test-harness parts that `xcodebuild test` adds to the Debug app (never shipped) are skipped.
            list="$(find "$APP" -type f \( -perm -u+x -o -name '*.dylib' \) -not -path '*.xctest/*' -not -path '*/Frameworks/XC*' \
                      -not -path '*/Frameworks/libXCTest*' -not -path '*/Frameworks/Testing.framework/*' -not -name 'lib_TestingInterop.dylib' -not -name '__preview.dylib' \
                      -exec sh -c 'file "$1" | grep -q Mach-O && echo "$1"' _ {} \;)"
            for b in $list; do
              echo "== $2: $b"
              if nm -u "$b" | grep -E "NSURLSession|URLSession|NSURLConnection|nw_connection|nw_endpoint|nw_parameters|CFNetwork|CFHTTP|CFStream.*Socket|SCNetworkReachability|CKContainer|CKDatabase|WKWebView|SFSafari|ASWebAuthentication|AsyncImage"; then FAIL=1; fi
              otool -L "$b" | tail -n +2 | awk '{print $1}' | while read -r lib; do
                case "$lib" in
                  /usr/lib/*|@rpath/FoldPulse.debug.dylib|@rpath/FoldPulseWidgets.debug.dylib|@rpath/libswift*|@rpath/FoldPulseCore_*) ;;
                  /System/Library/Frameworks/*|/System/Library/PrivateFrameworks/*)
                    name="$(basename "$lib")"
                    echo "$name" | grep -qxE "($ALLOWED)" || { echo "::error::$2: unexpected framework $lib in $b"; echo X >> fail.flag; } ;;
                  *) echo "::error::$2: unexpected library $lib in $b"; echo X >> fail.flag ;;
                esac
              done
            done
          }
          audit build/Build/Products/Debug-iphonesimulator/FoldPulse.app "Debug simulator"
          audit build-release/Build/Products/Release-iphoneos/FoldPulse.app "Release device"
          [ -f fail.flag ] && FAIL=1
          if [ $FAIL -ne 0 ]; then echo "PT-02 FAILED: see the audit step" >> results.txt; exit 1; fi
          echo "PT-02: Debug simulator and Release device builds: only allowed frameworks, no networking APIs; privacy manifests present." | tee -a "$GITHUB_STEP_SUMMARY" results.txt
      - name: Export screenshots
        if: always()
        run: |
          mkdir -p screenshots
          xcrun xcresulttool export attachments --path TestResults.xcresult --output-path screenshots || true
          ls -la screenshots | head -40
      - name: Publish screenshots to the ci/screenshots branch (for the project report)
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # The artifact download host isn't reachable from the build workspace; a branch is.
          python3 - <<'PY'
          import json, os, shutil
          os.makedirs("publish", exist_ok=True)
          try:
              manifest = json.load(open("screenshots/manifest.json"))
          except Exception:
              manifest = []
          def walk(node):
              if isinstance(node, dict):
                  name, exported = node.get("suggestedHumanReadableName"), node.get("exportedFileName")
                  if name and exported and exported.endswith(".png"):
                      shutil.copy(os.path.join("screenshots", exported), os.path.join("publish", name.split("_0_")[0] + ".png"))
                  for v in node.values(): walk(v)
              elif isinstance(node, list):
                  for v in node: walk(v)
          walk(manifest)
          print(sorted(os.listdir("publish")))
          PY
          cp screenshots/manifest.json publish/ 2>/dev/null || true
          cp results.txt publish/ 2>/dev/null || true
          cd publish
          git init -q -b ci/screenshots
          git config user.name "foldpulse-ci"; git config user.email "ci@users.noreply.github.com"
          git add -A && git commit -q -m "Screenshots from ${GITHUB_SHA::7} (run ${GITHUB_RUN_NUMBER})" || exit 0
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ci/screenshots
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshots
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            TestResults.xcresult
            xcodebuild.log
